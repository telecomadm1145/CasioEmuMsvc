name: Auto build and pre-release

on:
  pull_request:
    branches: [ "stable" ]
  workflow_dispatch:
  push:
    branches: [ "stable" ]

env:
  # MSBuild configs
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows
            platform_arch: x64
            os: windows-latest
            name: "Windows-x64"
          - platform: windows
            platform_arch: x86
            os: windows-latest
            name: "Windows-x86"
          - platform: android
            os: ubuntu-latest
            name: "Android"
          - platform: linux
            os: ubuntu-latest
            name: "Linux-x64"
    
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7
      with:
        fetch-depth: 1
        submodules: true

    - name: Add MSBuild to PATH
      if: matrix.platform == 'windows'
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      if: matrix.platform == 'windows'
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build Solution (${{ matrix.platform_arch }})
      if: matrix.platform == 'windows'
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{ matrix.platform_arch }} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload PDBs to Sentry
      if: matrix.platform == 'windows'
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
        SENTRY_ORG: "t5-j7"
        SENTRY_PROJECT: "native"
        COMMIT_HASH: ${{ github.sha }}
        RELEASE_TAG: "CasioEmuMsvc@${{ github.sha }}"
      working-directory: |
          ${{ matrix.platform_arch == 'x86' && format('Win32\\{0}', env.BUILD_CONFIGURATION) || format('{0}\\{1}', matrix.platform_arch, env.BUILD_CONFIGURATION) }}
      run: |
            $sentry_cli = "${{ github.workspace }}\CasioEmuMsvc\sentry-cli.exe"

            echo "Creating Sentry release $RELEASE_TAG"
            & $sentry_cli releases new $env:RELEASE_TAG || echo "Release already exists"

            & $sentry_cli debug-files upload -o $env:SENTRY_ORG -p $env:SENTRY_PROJECT .

            & $sentry_cli releases finalize $env:RELEASE_TAG

    - name: Upload ${{ matrix.platform_arch }} Build Artifact
      if: matrix.platform == 'windows'
      uses: actions/upload-artifact@v4.4.0
      with:
        name: Release-${{ matrix.platform_arch }}
        path: |
          ${{ matrix.platform_arch == 'x86' && format('Win32\\{0}', env.BUILD_CONFIGURATION) || format('{0}\\{1}', matrix.platform_arch, env.BUILD_CONFIGURATION) }}
        if-no-files-found: error

    - name: Set up JDK 21
      if: matrix.platform == 'android'
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission to gradlew
      if: matrix.platform == 'android'
      run: chmod +x gradlew

    - name: Build with Gradle
      if: matrix.platform == 'android'
      run: ./gradlew assembleRelease

    - name: Upload APK
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        compression-level: 0

    - name: Grant execute permission to build script
      if: matrix.platform == 'linux'
      run: chmod +x build-linux.sh

    - name: Build for Linux
      if: matrix.platform == 'linux'
      run: sudo DEBIAN_FRONTEND=noninteractive ./build-linux.sh -y

    - name: Upload Linux Build Artifact
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: Release-Linux-x64
        path: build/CasioEmuMsvc/CasioEmuMsvc
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7
      with:
        fetch-depth: 0

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Generate Release Details
      id: release_details
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        echo "COMMIT_HASH=$SHORT_HASH" >> $GITHUB_ENV
        echo "RELEASE_TAG=stable-$(date +'%Y%m%d%H%M%S')-$SHORT_HASH" >> $GITHUB_ENV
        echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
        
        CHANGELOG_CONTENT=$(git log -5 --pretty=format:"- %s (%h)" --abbrev-commit)
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        echo "$CHANGELOG_CONTENT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Prepare Release Assets
      run: |
        mkdir -p release_assets
        
        # Copy and rename Android APK
        if [ -f "./artifacts/app-release/app-release.apk" ]; then
          cp "./artifacts/app-release/app-release.apk" "release_assets/app-android-${{ env.COMMIT_HASH }}.apk"
        fi
        
        # Package Windows x86 build
        if [ -d "./artifacts/Release-x86" ]; then
          cd "./artifacts/Release-x86"
          zip -r "../../release_assets/windows-x86-${{ env.COMMIT_HASH }}.zip" .
          cd ../..
        fi
        
        # Package Windows x64 build
        if [ -d "./artifacts/Release-x64" ]; then
          cd "./artifacts/Release-x64"
          zip -r "../../release_assets/windows-x64-${{ env.COMMIT_HASH }}.zip" .
          cd ../..
        fi
        
        # Package Linux x64 build
        if [ -f "./artifacts/Release-Linux-x64/CasioEmuMsvc" ]; then
          cd "./artifacts/Release-Linux-x64"
          zip "../../release_assets/linux-x64-${{ env.COMMIT_HASH }}.zip" CasioEmuMsvc
          cd ../..
        fi
        
        ls -la release_assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.2.2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: '🚧 Auto Build ${{ env.RELEASE_TAG }} (Pre-release)'
        body: |
          ## ⚠️ Pre-release Auto Build
          
          > **Warning**: This is an automated pre-release build for testing purposes. 
          > It may contain bugs and is not recommended for production use.
          
          **Build Date:** ${{ env.RELEASE_DATE }}
          **Commit:** [${{ env.COMMIT_HASH }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          
          ### Recent Changes
          ${{ env.CHANGELOG }}
          
          ### Notes
          - This is an automated build from the latest commit on the stable branch
          - Use at your own risk - this is a development build
        files: release_assets/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}